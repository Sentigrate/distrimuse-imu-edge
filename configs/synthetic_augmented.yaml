defaults:
  split: configs/split.yaml

data:
  campaign: dc-extern-2026-01
  processing_version: null
  split_dir: ../distrimuse-synthetic-data/cache/imu_edge_synthetic_augmented/v35
  manifest_path: null
  cache_dir: cache
  window_cache_dir: cache/windows/synthetic_augmented
  window_size_s: 3.0
  hop_size_s: 1.0
  context_len: 8
  future_context_len: 0
  task_col: big_movement
  n_classes: 9
  sensor_cols: [acc_x, acc_y, acc_z, gyr_x, gyr_y, gyr_z]
