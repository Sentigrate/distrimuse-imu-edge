[project]
name = "distrimuse-imu-edge"
version = "0.1.0"
description = "IMU-only edge-model training, distillation, compression, and benchmarking for Distrimuse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "distrimuse-core>=0.2.0",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tqdm>=4.66",
    "plotly>=5.0",
    "torchinfo>=1.8.0",
    "onnx<1.22.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnx>=1.22.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
imu-edge-train = "distrimuse_imu_edge.cli.train:main"
imu-edge-distill = "distrimuse_imu_edge.cli.distill:main"
imu-edge-compress = "distrimuse_imu_edge.cli.compress:main"
imu-edge-quantize = "distrimuse_imu_edge.cli.quantize:main"
imu-edge-benchmark = "distrimuse_imu_edge.cli.benchmark:main"
imu-edge-pipeline = "distrimuse_imu_edge.cli.pipeline:main"
imu-edge-prepare-wisdm = "distrimuse_imu_edge.cli.prepare_wisdm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distrimuse_imu_edge"]

[tool.uv.sources]
distrimuse-core = { path = "../distrimuse-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
